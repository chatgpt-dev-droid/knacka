name: Knacka app (Expo)
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Also build installable app: none | android | ios | all"
        default: none
  push:
    branches: [main]
    paths: ['mobile/**']
jobs:
  update:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - run: npm ci
      - name: Stamp build
        run: echo "export const BUILD = '$(TZ=Europe/Stockholm date '+%d %b %H:%M')';" > src/lib/build.js
      - name: Link Expo project
        run: npx eas-cli init --non-interactive --force
      - name: Configure updates
        run: npx eas-cli update:configure --non-interactive || true
      - name: Channel main -> branch main
        run: npx eas-cli channel:create main --non-interactive || true
      - name: Publish update (opens in Expo Go)
        run: npx eas-cli update --branch main --message "${{ github.event.head_commit.message || 'manual' }}" --non-interactive --json > update.json && cat update.json
      - name: Expo Go link
        run: |
          PID=$(node -e "console.log(require('./app.json').expo.extra.eas.projectId)")
          echo "PROJECT_ID=$PID"
          echo "EXPO_GO_LINK=exp://u.expo.dev/$PID?channel-name=main&runtime-version=exposdk:58.0.0"
          echo "QR=https://qr.expo.dev/eas-update?projectId=$PID&runtimeVersion=exposdk:58.0.0&channel=main"
      - name: Build iOS app and send to TestFlight
        timeout-minutes: 15
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build == 'ios'
        env:
          ASC_KEY_ID: WVCWRG27VG
          ASC_ISSUER_ID: dc4795be-a778-4d37-8496-3a6aebebe80b
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          EXPO_APPLE_TEAM_ID: 7Q6QVS9862
          EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
        run: |
          node scripts/ios-creds.mjs
          npx eas-cli build -p ios --profile production --non-interactive --no-wait
      - name: Build Android app
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build == 'android'
        run: npx eas-cli build -p android --profile preview --non-interactive --no-wait
