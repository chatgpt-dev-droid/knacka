<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knacka</title>
<meta name="description" content="Knacka – dörrknackningsapp för Fiskaren.nu">
<meta name="theme-color" content="#0b6e7f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Knacka">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:0}
body{margin:0}
img{max-width:100%}

/* Layout: full-bleed map app — floating search/stats on top, FAB, 5-tab bar, slide-up lead sheet */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --ink:#10252d; --muted:#5f747d; --line:#dbe4e7; --soft:#e9eff1;
  --accent:#0b6e7f; --accent-ink:#ffffff; --mapbg:#e4ebe9;
  --st-ny:#ffffff; --st-borta:#8d9aa6; --st-nej:#d64541; --st-igen:#e39b14; --st-int:#7b5bd6; --st-mote:#2d7ff9; --st-kund:#1f9d55; --st-aldrig:#2b2f33;
  --shadow:0 4px 18px rgba(16,37,45,.14);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a1f; --surface:#14272e; --ink:#e4f0f2; --muted:#93acb4; --line:#24414a; --soft:#1b343c;
  --accent:#3fb6c8; --accent-ink:#05222a; --mapbg:#1a2c31; --st-ny:#e9eef0; --st-aldrig:#c9d2d6;
  --shadow:0 4px 18px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1f; --surface:#14272e; --ink:#e4f0f2; --muted:#93acb4; --line:#24414a; --soft:#1b343c;
  --accent:#3fb6c8; --accent-ink:#05222a; --mapbg:#1a2c31; --st-ny:#e9eef0; --st-aldrig:#c9d2d6;
  --shadow:0 4px 18px rgba(0,0,0,.4); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;background:var(--bg)}
.view[hidden]{display:none!important}
#v-map{overflow:hidden;background:var(--mapbg)}

/* --- minimal Leaflet core css --- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;background:var(--mapbg);outline:0;font-family:var(--body)}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-interactive{cursor:pointer}
.leaflet-overlay-pane svg{pointer-events:none}
.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-marker-icon{display:block}
.leaflet-control-container .leaflet-top,.leaflet-control-container .leaflet-bottom{position:absolute;z-index:800;pointer-events:none}
.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{pointer-events:auto;position:relative;clear:both;float:left}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);padding:1px 6px;border-top-left-radius:6px}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-tooltip{position:absolute;pointer-events:none;white-space:nowrap}
.area-label{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink);box-shadow:var(--shadow)}
/* fallback street pattern when tiles can't load */
#map.notiles{background-color:var(--mapbg);background-image:linear-gradient(var(--soft) 2px,transparent 2px),linear-gradient(90deg,var(--soft) 2px,transparent 2px);background-size:46px 46px}

/* pins */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .12s}
.pin span{transform:rotate(45deg);font-size:12px;font-weight:800;color:#fff;line-height:1}
.pin.new{background:var(--surface);border:2.5px solid var(--muted)}
.pin.new span{color:var(--muted)}
.pin.sel{transform:rotate(-45deg) scale(1.35)}
.pin.dim{opacity:.35}
.pnum{position:absolute;left:50%;top:30px;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:#10252d;background:rgba(255,255,255,.92);border-radius:5px;padding:0 4px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
.zfar .pnum{display:none}
.hn{min-width:22px;height:18px;padding:0 4px;border-radius:6px;background:rgba(255,255,255,.95);border:1.5px solid #8d9aa6;color:#10252d;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2);white-space:nowrap}
.hn:active{background:#0b6e7f;color:#fff;border-color:#0b6e7f}
.sheet{transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sheet.open{transform:none}
.scrim{opacity:0;transition:opacity .22s}
.scrim.open{opacity:1}
.noteadd{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.notes{display:flex;flex-direction:column;gap:8px}
.note1{background:var(--soft);border-radius:12px;padding:10px 12px}
.note1 p{margin:0 0 4px;white-space:pre-wrap;font-size:14px;line-height:1.4}
.note1 small{color:var(--muted);font-size:12px;font-weight:600}
.stat.rp{background:var(--st-nej);color:#fff;border:0;font-weight:700}
.replied{display:flex;gap:8px;align-items:center;width:100%;margin-top:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink);font-weight:700;font-size:15px;min-height:44px}
.bubble.cust{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.bubble.sms{background:color-mix(in srgb,#4f7cff 14%,var(--surface))}
.av.cust{background:var(--muted)}
.stat.nh{background:#4f7cff;color:#fff;border:0;font-weight:700}
.nhrow{grid-template-columns:auto 1fr auto;cursor:pointer}
.nhrow input{width:22px;height:22px;accent-color:var(--accent)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.stat.due{background:var(--st-igen);color:#1d1400;font-weight:700;border:0}
.rnum{width:22px;height:22px;border-radius:50%;background:#2d7ff9;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.routebar{flex-wrap:wrap;background:var(--surface);padding-block:12px;bottom:0;padding-bottom:12px;box-shadow:0 -6px 20px rgba(0,0,0,.12);border-radius:16px 16px 0 0}
.routebar .rinfo{flex:1 0 100%;font-size:14px}
.routebar .rinfo small{display:block;color:var(--muted);font-size:12px}
.routebar .btn{flex:1}
.leaflet-container{-webkit-user-select:none;user-select:none}
.leaflet-marker-icon,.leaflet-marker-pane{will-change:transform}

/* ---- v3 field UI ---- */
.maphead{position:absolute;top:0;left:0;right:0;z-index:960;display:flex;align-items:center;justify-content:space-between;background:var(--surface);padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px;box-shadow:0 1px 0 var(--line)}
.mtitle{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em}
.iconbtn.flat{box-shadow:none;background:transparent;width:46px;height:46px}
.iconbtn.flat.sm{width:40px;height:40px}
.iconbtn .badge{top:4px;right:2px;width:auto;height:auto;min-width:18px;padding:1px 5px;border-radius:999px;color:#fff;font-size:11px;font-weight:800;line-height:16px;text-align:center}
.searchrow{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:0;right:0;z-index:955;display:flex;gap:8px;align-items:center;background:var(--surface);padding-block:8px;box-shadow:0 1px 0 var(--line)}
.statstrip{top:calc(66px + env(safe-area-inset-top,0px))}
.results{top:calc(116px + env(safe-area-inset-top,0px))}
.ltools{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(112px + env(safe-area-inset-top,0px));z-index:900;display:flex;flex-direction:column;gap:10px}
.rpin{width:30px;height:30px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;transition:transform .14s cubic-bezier(.2,.8,.2,1)}
.rpin.new{background:#fff;border:2.5px solid #8d9aa6;width:22px;height:22px;margin:4px}
.rpin.sel{transform:scale(1.3);box-shadow:0 0 0 3px var(--ink),0 3px 10px rgba(0,0,0,.4)}
.rpin.dim{opacity:.3}
.pnum{top:31px}
.sdot{flex:none;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;vertical-align:middle}
.sdot.new{background:var(--surface);border:2.5px solid var(--muted);box-sizing:border-box}
.strow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 4px;scroll-snap-type:x proximity}
.strow::-webkit-scrollbar{display:none}
.strow .stb{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);scroll-snap-align:start;touch-action:manipulation}
.strow .stb .sdot{transition:transform .09s ease}
.strow .stb:active .sdot{transform:scale(.92)}
.strow .stb[aria-pressed="true"] .sdot{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--ink)}
.peekhead{display:flex;gap:12px;align-items:center}
.ph-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ph-t b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-t span{color:var(--muted);font-size:14px;font-weight:600}
.peekaddr{margin-top:10px;font-size:16px;font-weight:600}
.dchips{margin-top:2px}
.chip.ic{position:relative;display:inline-flex;gap:8px;align-items:center;padding:9px 14px;font-weight:600;min-height:44px;box-sizing:border-box}
.chip.ic svg{color:var(--muted)}
.chip.ic.on{border-color:var(--accent)}
.chip.ic.on svg{color:var(--accent)}
.overpick{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.bubble{background:var(--soft);border-radius:14px;padding:10px 13px;max-width:100%}
.bubble p{margin:0;white-space:pre-wrap;font-size:15px;line-height:1.45}
.bubble small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer input,.composer textarea{flex:1;border-radius:22px;padding:12px 16px;background:var(--soft);border:1px solid transparent;font-size:16px;resize:none}
.composer input:focus,.composer textarea:focus{border-color:var(--accent);outline:none}
.sendbtn{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.actrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.actrow .act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;background:transparent;font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none;min-height:44px}
.actrow .act svg{width:52px;height:52px;padding:14px;box-sizing:border-box;border-radius:50%;background:var(--soft);color:var(--ink)}
.actrow .act[aria-disabled="true"]{opacity:.35;pointer-events:none}
.assigned{text-align:center;margin-top:12px;color:var(--muted);font-size:14px}
.assigned b{color:var(--ink)}
/* details page */
.detail{position:fixed;inset:0;z-index:1150;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.detail.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;background:var(--surface);padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px))}
.dtitle{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.dtitle b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.dtitle span{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
.dtabs{display:flex;justify-content:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line)}
.dtabs button{padding:12px 18px;font-weight:700;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;min-height:48px}
.dtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.dbody{flex:1;overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.dsec{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .wide{grid-column:1/-1}
.plain{margin:0;font-size:16px}
.composer.docked{background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.chat{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.msg{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.mhead{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.mhead small{color:var(--muted);font-size:12.5px}
.av.sm{width:36px;height:36px;font-size:13px}
.activity{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.dayhead{background:var(--soft);color:var(--muted);font-size:13px;font-weight:700;padding:10px max(16px,env(safe-area-inset-left,0px))}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.evt{min-width:0}
.evt b{display:block;font-size:15px}
.evt small{color:var(--muted);font-size:13px}
.evt p{margin:4px 0 0;font-size:14px;white-space:pre-wrap}
.dist{display:flex;gap:4px;align-items:center;font-size:13px;font-weight:700;white-space:nowrap}
.dist.ok{color:var(--st-kund)}
.dist.far{color:var(--st-nej)}
.dist.none{color:var(--muted);font-weight:600}
.strow-ed{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ed{display:flex;flex-direction:column;gap:6px;min-width:0}
.edrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.edrow input[type=color]{width:44px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.edrow select{width:auto;flex:1;min-width:110px;padding:8px}
.fchip{display:flex;gap:8px;align-items:center;justify-content:flex-start;padding:6px 12px 6px 6px}
.fchip[aria-pressed="false"]{opacity:.5}
.btn svg{vertical-align:-3px}
@media (prefers-reduced-motion:reduce){.detail,.sheet{transition:none}}
#baseBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.me-dot{width:16px;height:16px;border-radius:50%;background:#2d7ff9;border:3px solid #fff;box-shadow:0 0 0 6px rgba(45,127,249,.25)}

/* map overlays */
.topbar{position:absolute;top:10px;left:0;right:0;z-index:900;display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:0 12px;height:46px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:15px}
.search svg{flex:none;color:var(--muted)}
.iconbtn{flex:none;width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink);position:relative}
.iconbtn .badge{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--st-nej)}
.statstrip{position:absolute;top:66px;left:0;right:0;z-index:900;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:none}
.statstrip>*{pointer-events:auto}
.stat{flex:none;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.stat b{font-weight:800}
.results{position:absolute;top:66px;left:0;right:0;z-index:950}
.results .box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);max-height:50vh;overflow-y:auto}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.fabs{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:18px;z-index:900;display:flex;flex-direction:column;gap:10px;align-items:center}
.fab{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(11,110,127,.45);display:grid;place-items:center}
.cross{position:absolute;left:50%;top:50%;z-index:880;transform:translate(-50%,-100%);pointer-events:none}
.placebar{position:absolute;left:0;right:0;bottom:18px;z-index:950;display:flex;gap:8px}
.placebar .btn{flex:1}
.tilenote{position:absolute;left:12px;bottom:18px;z-index:850;max-width:62%;font-size:11px;color:var(--muted);background:var(--surface);border-radius:10px;padding:6px 9px;box-shadow:var(--shadow)}

/* tabs */
nav.tabs{background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);position:relative;z-index:1000}
nav.tabs button{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--st-nej);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px;min-width:16px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,26,.42);z-index:1100}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1101;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding-block:6px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 34px rgba(0,0,0,.2);overscroll-behavior:contain}
@media (min-width:720px){.sheet{left:auto;right:16px;bottom:16px;width:420px;border-radius:20px;max-height:calc(100% - 32px)}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.shead{display:flex;gap:10px;align-items:flex-start}
.shead h2{flex:1;min-width:0;font-size:26px;line-height:1.1}
.leadmeta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:15px}
.li .t .pill{display:inline-block}
.toast{display:flex;gap:14px;align-items:center}
.toastbtn{color:var(--bg);font-weight:800;text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:2px 0}
.x{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:28px}
h2{font-size:22px}
h3{font-size:15px;color:var(--ink);margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.sec{margin-top:18px;display:flex;flex-direction:column;gap:10px}

/* status bar */
.stbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-top:16px}
.stb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15}
.stb i{width:58px;height:58px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .1s}
.stb[aria-pressed="true"]{color:var(--ink)}
.stb[aria-pressed="true"] i{outline:3px solid var(--ink);outline-offset:3px}
.stb:active i{transform:scale(.92)}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;background:var(--soft);font-size:12px;font-weight:700;color:var(--ink);text-decoration:none}
.act svg{color:var(--accent)}
.act[aria-disabled="true"]{opacity:.4;pointer-events:none}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=datetime-local],input[type=search],textarea,select{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
textarea{resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.btn{border-radius:14px;padding:13px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);text-align:center;font-size:15px;display:block;width:100%;box-sizing:border-box;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--st-nej);border:1.5px solid color-mix(in srgb,var(--st-nej) 40%,transparent)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;width:auto;display:inline-block}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl:last-child{border-bottom:0}
.tl i{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:4px}
.tl small{color:var(--muted);font-variant-numeric:tabular-nums}
.reminder{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--st-igen) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--st-igen) 35%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}

/* lists */
.page{padding-block:16px 24px;display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .dot{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.li .dot.new{background:var(--soft);color:var(--muted)}
.li .t{min-width:0}
.li .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
.note{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:9px 12px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.day{flex:none;width:54px;padding:8px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.day b{font-family:var(--display);font-size:20px;color:var(--ink)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] b{color:var(--accent-ink)}
.day .n{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--st-igen)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .av{width:46px;height:46px;font-size:17px}
.pod b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.pod small{color:var(--muted);font-size:12px;font-weight:600}
.pod.first{padding-block:18px;border-color:color-mix(in srgb,var(--st-igen) 60%,transparent);background:color-mix(in srgb,var(--st-igen) 9%,var(--surface))}
.medal{font-size:13px}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center}
.spread{justify-content:space-between}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legend span{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.legend i{width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:800}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:1300;max-width:calc(100% - 40px);text-align:center;box-shadow:var(--shadow)}
.confirm{display:flex;gap:8px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#app{display:flex;flex-direction:column;height:100%}
#auth{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow-y:auto;padding-block:max(40px,env(safe-area-inset-top,0px)) 40px}
.authcard{max-width:400px;margin:0 auto}
.logo{display:flex;gap:12px;align-items:center}
.logo i{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:28px}
.logo b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.logo small{color:var(--muted);font-weight:700;font-size:13px}
.autherr{background:color-mix(in srgb,var(--st-nej) 12%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--st-nej) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.autherr.ok{background:color-mix(in srgb,var(--st-kund) 12%,var(--surface));border-color:color-mix(in srgb,var(--st-kund) 40%,transparent)}
.linkbtn{color:var(--accent);font-weight:700;font-size:14px;padding:6px 0;align-self:center}
input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.btn:disabled{opacity:.6}
.offline{background:var(--st-igen);color:#1d1400;font-size:12.5px;font-weight:700;text-align:center;padding:6px 16px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
</style>
</head>
<body>

<div id="app" hidden>
<div class="offline" id="offline" hidden data-t="offline">Offline</div>
<main>
  <section class="view" id="v-map">
    <div id="map" style="position:absolute;inset:0"></div>
    <header class="maphead gut">
      <button class="iconbtn flat" id="filterBtn" aria-label="Filter"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6.5h16M7 12h10M10 17.5h4"/></svg><span class="badge" id="filterBadge" hidden></span></button>
      <b class="mtitle" data-t="mapTitle">Knacka</b>
      <button class="iconbtn flat" id="searchBtn" aria-label="Sök"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    </header>
    <div class="searchrow gut" id="searchRow" hidden>
      <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="q" type="search" autocomplete="off" data-ph="searchPh" placeholder="Sök adress eller namn"></label>
      <button class="btn sm ghost" id="searchClose" data-t="cancel">Avbryt</button>
    </div>
    <div class="statstrip gut" id="statstrip"></div>
    <div class="results gut" id="results" hidden><div class="box" id="resultsBox"></div></div>
    <div class="ltools"><button class="iconbtn" id="routeBtn" aria-label="Planera rutt"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18h7.3a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H15.8"/></svg></button></div>
    <div class="fabs" id="fabs">
      <button class="iconbtn" id="baseBtn" aria-label="Satellit" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg></button>
      <button class="iconbtn" id="locBtn" aria-label="Min position"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="fab" id="addBtn" aria-label="Ny lead"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="cross" id="cross" hidden><div class="pin" style="--c:var(--accent)"><span>+</span></div></div>
    <div class="placebar gut" id="drawbar" hidden><button class="btn ghost" id="drawCancel" data-t="cancel">Avbryt</button><button class="btn ghost" id="drawUndo" data-t="undo">Ångra</button><button class="btn" id="drawDone"><span data-t="done">Klar</span> (<span id="drawCount">0</span>)</button></div>
    <div class="placebar gut routebar" id="routebar" hidden><div class="rinfo" id="routeInfo"></div><a class="btn" id="routeGo" target="_blank" rel="noopener" data-t="openGmaps">Öppna i Google Maps</a><button class="btn ghost" id="routeEnd" data-t="endRoute">Avsluta rutt</button></div>
    <div class="placebar gut" id="placebar" hidden><button class="btn ghost" id="placeCancel" data-t="cancel">Avbryt</button><button class="btn" id="placeOk" data-t="placeHere">Placera här</button></div>
  </section>
  <section class="view" id="v-leads" hidden><div class="page gut" id="leadsPane"></div></section>
  <section class="view" id="v-cal" hidden><div class="page gut" id="calPane"></div></section>
  <section class="view" id="v-comp" hidden><div class="page gut" id="compPane"></div></section>
  <section class="view" id="v-more" hidden><div class="page gut" id="morePane"></div></section>
</main>

<nav class="tabs" aria-label="Meny">
  <button data-tab="map" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="tMap">Karta</span></button>
  <button data-tab="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span data-t="tLeads">Leads</span></button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="tCal">Kalender</span><span class="count" id="calCount" hidden></span></button>
  <button data-tab="comp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span data-t="tComp">Tävling</span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span data-t="tMore">Mer</span><span class="count" id="moreCount" hidden></span></button>
</nav>
</div>
<div id="auth" class="gut" hidden></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet gut" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="detail" id="detail" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden aria-live="polite"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
